name: Build TunePXO COBI (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/signalsmith-pitch-engine
      - experiment/psola-engine
    paths:
      - CMakeLists.txt
      - 'Source/**'
      - 'Tests/**'
      - 'ThirdParty/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target TunePXO_COBI_VST3 TunePXO_COBI_Standalone

      - name: Build PSOLA smoke test
        run: cmake --build build --config Release --target PsolaSmokeTest

      - name: Run PSOLA smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload plugin builds
        uses: actions/upload-artifact@v4
        with:
          name: TunePXO-COBI-Windows-VST3
          path: |
            build/TunePXO_COBI_artefacts/Release/VST3/**
            build/TunePXO_COBI_artefacts/Release/Standalone/**
          if-no-files-found: error
